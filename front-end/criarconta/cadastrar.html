<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta</title>
  <link rel="stylesheet" href="cadastrar.css">
  <link rel="stylesheet" href="popup/popup.css">
</head>
<body>
  <div class="cadastro-container">
    <h2>Criar Conta</h2>
    
    <div class="input-group">
      <label for="name">Nome completo</label>
      <input type="text" id="name" name="name" placeholder="Digite seu nome" required>
    </div>

    <div class="input-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required>
    </div>

    <div class="input-group">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="Crie uma senha" required>
    </div>

    <button type="" class="btn">Cadastrar</button>
    
    <p class="footer-text">
      Já tem uma conta? <a href="../login/login.html">Fazer login</a>
    </p>
  </div>
  <div class="popup-overlay" style="display: none;">
    
    <!-- Cartão do Modal -->
    <div class="popup-card">
      <!-- Botão de Fechar 'X' -->
      <button class="popup-close-btn" aria-label="Fechar">&times;</button>

      <!-- Ícone Visual (Opcional) -->
      <div class="popup-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </div>

      <!-- Conteúdo do Pop-up -->
      <h2 class="popup-title">Aviso Importante</h2>

      <!-- Ações/Botões -->
      <div class="popup-actions">
        <button class="popup-btn popup-btn-primary">Entendido / OK</button>
      </div>
    </div>

  </div>
  <script src="cadastrar.js"></script>
</body>
</html>
