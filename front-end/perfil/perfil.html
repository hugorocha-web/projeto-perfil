<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil</title>
  <link rel="stylesheet" href="perfil.css">
</head>
<body>

  <main class="profile-container">
    <div class="profile-card">
      <div class="avatar-container">
        <img 
          src="" 
          alt="Foto de perfil padrão" 
          class="profile-avatar"
        >
      </div>

      <h1 class="profile-name">Usuário</h1>
      <p class="profile-bio">
        
      </p>
      <button class="btnedit">
        Editar Bio
      </button>
      <button id="btnfoto">
        Editar Foto
      </button>
    </div>
    
  </main>
  <div id="fundopreto" style="display: none;">
    <div class="form">
      <label for="input">Nova Bio</label>
      <input type="text" id="input" placeholder="">
      <button id="btn">Editar</button>
    </div>
  </div>
  <div id="enterimg-escuro" style="display: none;">
    <div class="formimg">
      <label for="imagem"></label>
      <input type="file" id="imagem" accept="image/*">
      <img id="previewFoto" src="" alt="Prévia da foto" style="max-width: 200px; display: none;">
      <span id="nome-arquivo">Nenhuma imagem selecionada</span>
      <button id="btnenviarfoto">Enviar</button>
    </div>

  </div>
  <script src="perfil.js"></script>
</body>
</html>
