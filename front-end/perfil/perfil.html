<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil</title>
  <link rel="stylesheet" href="perfil.css">
</head>
<body>

  <main class="profile-container">
    <div class="profile-card">
      <div class="avatar-container">
        <img 
          src="https://www.cartacapital.com.br/wp-content/uploads/2021/01/Bolsonaro-Impeachment-1.jpg" 
          alt="Foto de perfil padrão" 
          class="profile-avatar"
        >
      </div>

      <h1 class="profile-name">Usuário</h1>
      <p class="profile-bio">
        
      </p>
      <button class="btnedit">
        Editar Bio
      </button>
    </div>
    
  </main>
  <div id="fundopreto" style="display: none;">
    <div class="form">
      <label for="input">Nova Bio</label>
      <input type="text" id="input" placeholder="">
      <button id="btn">Editar</button>
    </div>
  </div>
  <script src="perfil.js"></script>
</body>
</html>
